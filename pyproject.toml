[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assistant"
version = "0.0.1"
description = "Leo's personal assistant (Telegram + Claude Agent SDK)"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "claude-agent-sdk",
    "icalendar",
    "recurring-ical-events",
    "pypdf",
]

[project.scripts]
assistant = "assistant.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["assistant"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
